# Production stack on the Vultr server. Run by docker/remote-deploy.sh from /opt/dispel/repo.
# .env (written once by Terraform's cloud-init) lives outside the repo.
services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    env_file:
      - path: /opt/dispel/.env
    environment:
      DATA_DIR: /var/lib/dispel
      # Stand-in detector while MODEL_DIR has no hearsay.json (server/app/hf_model.py). Weights are fetched once into
      # HF_HOME on the data volume; audio is scored here and never sent to Hugging Face.
      HF_MODEL: mo-thecreator/Deepfake-audio-detection
      HF_REVISION: e4d9874b493362149cec96ced85f00b00b1a04c0
      HF_HOME: /var/lib/dispel/hf
      # Skip the evidence-only analyzers of profile nn: the app never shows them, they add ~230 ms of CPU per check, and
      # v5c ships no reference stats, so their findings always read "within the range of real speech", even under a
      # likely_synthetic verdict. Scores do not change. Turn back on once a release carries ref/prosody_ref.
      HEARSAY_EXPLAIN: "0"
    volumes:
      - /opt/dispel/models:/models:ro # the persistent Vultr volume, holds the model weights
      - /opt/dispel/data:/var/lib/dispel # check history (server/app/store.py); survives redeploys, not a server replacement
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - /opt/dispel/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/dispel/repo/web:/srv/web:ro # hocuspocus.tech; updated in place by each deploy
      - caddy_data:/data
    restart: unless-stopped
volumes:
  caddy_data:
