<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"
    />
    <title>Dispel wizard</title>
    <link rel="stylesheet" href="wizard.css" />
  </head>
  <body>
    <div id="bubble" class="bubble" hidden>
      <button id="bubble-close" class="bubble-close" aria-label="Close">×</button>
      <p id="bubble-title" class="bubble-title"></p>
      <div id="bubble-score" class="bubble-score" hidden>
        <span id="digits" class="digits"></span><span class="percent">%</span>
        <span id="score-label" class="score-label"></span>
      </div>
      <p id="bubble-note" class="bubble-note"></p>
      <button id="learn-more" class="link-btn" hidden>How do these scams work?</button>
      <div id="lesson" class="lesson" hidden>
        <p id="lesson-text" class="lesson-text"></p>
        <div id="lesson-topics" class="lesson-topics"></div>
        <div id="lesson-nav" class="lesson-nav">
          <button id="lesson-back" class="btn">Back</button>
          <span id="lesson-page" class="lesson-page"></span>
          <button id="lesson-next" class="btn btn-yes">Next</button>
        </div>
      </div>
      <div id="bubble-ask" class="bubble-ask" hidden>
        <p id="ask-text" class="ask-text"></p>
        <div class="ask-buttons">
          <button id="ask-yes" class="btn btn-yes">Yes, hang up</button>
          <button id="ask-no" class="btn">No</button>
        </div>
        <div id="notify-row" class="notify-row" hidden>
          <button id="notify-btn" class="btn btn-notify"></button>
          <span id="notify-status" class="notify-status"></span>
        </div>
      </div>
    </div>

    <canvas
      id="stage"
      class="stage"
      width="80"
      height="120"
      title="Drop an audio file on me, or click to choose one"
    ></canvas>

    <script src="sprites.js"></script>
    <script src="lessons.js"></script>
    <script src="wizard.js"></script>
  </body>
</html>
