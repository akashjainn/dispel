<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>Demo call</title>
    <link rel="stylesheet" href="call-sim.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="live"></span>
      <span class="title">Voice call</span>
      <span class="badge">Demo call</span>
      <span id="timer" class="timer">00:00</span>
    </header>

    <main class="caller">
      <div class="avatar" aria-hidden="true">?</div>
      <p class="name">Unknown caller</p>
      <p class="sub">“Hi, it’s me. I’m in trouble and need money right now…”</p>
      <div class="wave" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </main>

    <footer class="controls">
      <button class="ctl" aria-label="Mute">🎙</button>
      <button class="ctl" aria-label="Speaker">🔈</button>
      <button id="hangup" class="ctl hangup" aria-label="Hang up">✕</button>
    </footer>

    <script src="call-sim.js"></script>
  </body>
</html>
