<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Call highlight</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      .glow {
        position: absolute;
        inset: 4px;
        border: 4px solid #a855f7;
        border-radius: 14px;
        box-shadow: 0 0 18px 4px rgba(168, 85, 247, 0.75), inset 0 0 18px 2px rgba(168, 85, 247, 0.45);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
  </body>
</html>
