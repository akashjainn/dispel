name: deploy

# Deploys server code to the Vultr instance over SSH. The runner opens a temporary
# firewall rule for its own IP (port 22 is otherwise closed to CI), logs in as the
# `deploy` user (whose key can only run /opt/dispel/deploy.sh), then closes the rule.
on:
  push:
    branches: [main]
    paths: ["server/**", "hearsay/**", "docker/**", "docs/examples/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
    steps:
      - name: Find the server
        id: srv
        run: |
          r=$(curl -fsS -H "Authorization: Bearer $VULTR_API_KEY" "https://api.vultr.com/v2/instances?label=dispel-api")
          ip=$(echo "$r" | jq -r '.instances[0].main_ip // empty')
          fw=$(echo "$r" | jq -r '.instances[0].firewall_group_id // empty')
          if [ -z "$ip" ] || [ "$ip" = "0.0.0.0" ] || [ -z "$fw" ]; then echo "server not found or not ready"; exit 1; fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "fw=$fw" >> "$GITHUB_OUTPUT"

      - name: Open SSH for this runner
        id: fw
        run: |
          me=$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')
          id=$(curl -fsS -X POST "https://api.vultr.com/v2/firewalls/${{ steps.srv.outputs.fw }}/rules" \
            -H "Authorization: Bearer $VULTR_API_KEY" -H "Content-Type: application/json" \
            -d "{\"ip_type\":\"v4\",\"protocol\":\"tcp\",\"subnet\":\"$me\",\"subnet_size\":32,\"port\":\"22\",\"notes\":\"gha-${{ github.run_id }}\"}" \
            | jq -r '.firewall_rule.id')
          echo "rule=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          ip=${{ steps.srv.outputs.ip }}
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > key
          # wait for the firewall rule to take effect, and record the host key
          for i in $(seq 1 18); do
            ssh-keyscan -T 5 "$ip" > known_hosts 2>/dev/null && [ -s known_hosts ] && break
            sleep 5
          done
          [ -s known_hosts ] || { echo "cannot reach $ip:22"; exit 1; }
          # the server forces this login to run /opt/dispel/deploy.sh
          ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes deploy@"$ip"

      - name: Health check
        run: |
          host="$(echo ${{ steps.srv.outputs.ip }} | tr . -).sslip.io"
          for i in $(seq 1 24); do
            if curl -fsS -m 8 "https://$host/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "health check failed"; exit 1

      - name: Close SSH
        if: always() && steps.fw.outputs.rule != ''
        run: |
          curl -fsS -X DELETE "https://api.vultr.com/v2/firewalls/${{ steps.srv.outputs.fw }}/rules/${{ steps.fw.outputs.rule }}" \
            -H "Authorization: Bearer $VULTR_API_KEY"
