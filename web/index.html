<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Gemini</title>
<meta name="description" content="Team Gemini at HackGT 13. Hocus Pocus checks whether audio is likely AI-generated.">
<style>
  :root { --bg: #f6f4fb; --fg: #1d1830; --muted: #625a78; --accent: #6b3fd4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #120f1c; --fg: #ece8f7; --muted: #a39cb8; --accent: #b395ff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
  }
  h1 { margin: 0; font-size: clamp(2.5rem, 10vw, 5rem); letter-spacing: -0.03em; line-height: 1.05; }
  h1 span { color: var(--accent); }
  p { margin: 1rem 0 0; color: var(--muted); }
</style>
</head>
<body>
  <main>
    <h1>Team <span>Gemini</span></h1>
    <p>HackGT 13 · Hocus Pocus: is that voice likely AI-generated?</p>
    <p>Web app coming soon.</p>
  </main>
</body>
</html>
